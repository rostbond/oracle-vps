---
- name: Create rclone config folder
  become: false
  ansible.builtin.file:
    path: "{{ vaultwarden_backup_config_dir }}"
    state: directory
    mode: "0755"

- name: Copy rclone.conf template
  become: false
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: "{{ vaultwarden_backup_config_dir }}/rclone.conf"
    mode: "0644"

- name: Setup Vaultwarden Backup
  become: false
  containers.podman.podman_container:
    name: vaultwarden-backup
    image: docker.io/ttionya/vaultwarden-backup:latest
    network: "{{ proxy_network }}"
    state: created
    restart_policy: always
    volumes:
      - "{{ vaultwarden_dir }}:/bitwarden/data:ro"
      - "{{ vaultwarden_backup_config_dir }}:/config/rclone:ro"
    env:
      CRON_TIME: "0 3 * * *" # Every day at 03:00
      BACKUP_KEEP_DAYS: "30"   # Keep backups for the last 30 days
      RCLONE_REMOTE_NAME: "B2"
      RCLONE_REMOTE_DIR: "/skyfall-vaultwarden/"
      ZIP_ENABLE: true
      ZIP_TYPE: "zip"
      ZIP_PASSWORD: "{{ vault_vaultwarden_backup_zip_password }}" # Additional encryption
      TIMEZONE: "Europe/Madrid"
    generate_systemd:
      path: "/home/{{ ansible_user }}/.config/systemd/user/"
      restart_policy: always
      names: true
