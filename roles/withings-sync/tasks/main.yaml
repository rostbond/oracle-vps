---
- name: Create withings-sync folder
  become: false
  ansible.builtin.file:
    path: "{{ withings_sync_config_dir }}"
    state: directory
    mode: "0755"

- name: Create withings-sync config folder
  become: false
  ansible.builtin.file:
    path: "{{ withings_sync_config_dir }}/config"
    state: directory
    mode: "0700"

- name: Start withings-sync container
  become: false
  containers.podman.podman_container:
    name: withings-sync
    image: ghcr.io/jaroslawhartman/withings-sync:latest
    network: "{{ proxy_network }}"
    state: created
    environment:
      TZ: Europe/Madrid
      STACK_PATH: "{{ withings_sync_config_dir }}"
      GARMIN_USERNAME: "{{ vault_withings_sync_garmin_username }}"
      GARMIN_PASSWORD: "{{ vault_withings_sync_garmin_password }}"
    volumes:
      - "{{ withings_sync_config_dir }}/config:/config:Z"
      - "/etc/localtime:/etc/localtime:ro"
    command:
      - --config-folder
      - /config
      - --features
      - BLOOD_PRESSURE
 
- name: Create withings-sync systemd service
  become: false
  ansible.builtin.template:
    src: withings-sync.service.j2
    dest: "{{ ansible_user_dir }}/.config/systemd/user/withings-sync.service"
    mode: "0644"
  notify: Restart withings-sync timer

- name: Create withings-sync systemd timer
  become: false
  ansible.builtin.template:
    src: withings-sync.timer.j2
    dest: "{{ ansible_user_dir }}/.config/systemd/user/withings-sync.timer"
    mode: "0644"
  notify: Restart withings-sync timer

- name: Enable withings-sync timer
  become: false
  ansible.builtin.systemd_service:
    name: withings-sync.timer
    enabled: true
    state: started
    scope: user
    daemon_reload: true