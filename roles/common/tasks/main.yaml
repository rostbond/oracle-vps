---
- name: Update packages (apt-get update)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install packages
  ansible.builtin.package:
    name:
      - htop
      - curl
      - git
      - vim
      - tree
      - ncdu  # Анализ места на диске, очень полезно на мелких VPS
      - unzip
    state: present

- name: Install unattended-upgrades
  ansible.builtin.package:
    name: unattended-upgrades
    state: present

- name: Setup automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: "0644"
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
          "${distro_id}ESMApps:${distro_codename}-security";
          "${distro_id}ESM:${distro_codename}-security";
      };
      Unattended-Upgrade::AutoFixInterruptedDpkg "true";
      Unattended-Upgrade::MinimalSteps "true";
      Unattended-Upgrade::InstallOnShutdown "false";
      Unattended-Upgrade::Mail "root";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false"; # Do not reboot server automatically

- name: Create updates schedule
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

- name: Set timezone
  community.general.timezone:
    name: "Europe/Madrid"

- name: Set time sync
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: started
    enabled: true

- name: Allow inbound traffic on 80 port (HTTP)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "80"
    jump: ACCEPT
    action: insert
    rule_num: "6"

- name: Allow inbound traffic on 443 port (HTTPS)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "443"
    jump: ACCEPT
    action: insert
    rule_num: "6"

- name: Allow inbound traffic on UDP 443 port (HTTP/3)
  ansible.builtin.iptables:
    chain: INPUT
    protocol: udp
    destination_port: "443"
    jump: ACCEPT
    action: insert
    rule_num: "6"

- name: Save iptables rules
  ansible.builtin.command: netfilter-persistent save
  # Notify linter that this command doesn't change system state
  changed_when: false

- name: Allow rootless Podman to bind 80 and 443 ports
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '80'
    sysctl_set: true
    state: present

- name: Setup welcome message (MOTD)
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |
      ============================================
       WELCOME TO ORACLE VPS - MANAGED BY ANSIBLE
      ============================================
      Environment: Production
      Services: RSSHub, Caddy, Redis

- name: Install packages required for rootless Podman
  ansible.builtin.package:
    name:
      - slirp4netns
      - fuse-overlayfs
    state: present

- name: Allow user to start processes after the SSH logout (Linger)
  ansible.builtin.command: "loginctl enable-linger {{ ansible_user }}"
  register: common_linger_check
  changed_when: false
